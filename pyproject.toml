[project]
name = "nepse-analyst"
version = "2.0.0"
description = "A natural language research assistant for Nepal's retail investors"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.9",
    "langdetect>=1.0.9",
    "lxml>=6.0.2",
    "numpy>=2.4.3",
    "pandas>=2.2,<3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# An explicit rule set, so CI does not change when ruff's defaults do:
# pycodestyle errors, pyflakes, bugbear, and import sorting.
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# The scripts put the repository on sys.path before importing the package.
"scripts/*.py" = ["E402"]
