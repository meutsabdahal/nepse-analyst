name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (exactly as locked, with the dev group)
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Unit tests
        # No database, vector store or model cache exists in CI; the tests
        # build what they need in temporary directories and stub the LLM.
        run: uv run --locked python -m unittest discover -s tests -p "test_*.py"
